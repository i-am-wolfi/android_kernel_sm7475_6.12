name: build-marble-diwali

on:
  workflow_dispatch:
  push:
    branches: [lineage-24.0]

jobs:
  dtb-check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Valida Makefile + DTS diwali
        run: |
          grep -q DIWALI_BASE_DTB devicetrees/qcom/Makefile
          ls devicetrees/qcom/diwali.dts devicetrees/qcom/diwali.dtsi devicetrees/qcom/diwalip.dts
          sudo apt-get update -qq && sudo apt-get install -y -qq device-tree-compiler
          dtc -I dts -O dtb -o /tmp/diwali-test.dtb devicetrees/qcom/diwali.dts && echo "DTC OK"
          dtc -I dts -O dtb -o /tmp/diwali-idp-test.dtb devicetrees/qcom/diwali-idp.dts && echo "IDP OK"
      - uses: actions/upload-artifact@v4
        with:
          name: diwali-dtb-test
          path: /tmp/diwali-*.dtb

  full-kernel:
    runs-on: ubuntu-22.04
    needs: dtb-check
    steps:
      - uses: actions/checkout@v4
      - name: Deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq git-core gnupg flex bison build-essential zip curl \
            zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 libncurses5-dev \
            lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev \
            libxml2-utils xsltproc unzip fontconfig python3 python3-pip cpio \
            device-tree-compiler lz4 brotli
          pip3 install --quiet git+https://github.com/google/repo.git 2>/dev/null || true
      - name: Sync kernel + modules (ltdq 6.12)
        run: |
          git clone --depth 1 --branch lineage-24.0 https://github.com/ltdq/android_kernel_qcom_sm8450-6.12 kernel
          git clone --depth 1 --branch lineage-24.0 https://github.com/ltdq/android_kernel_qcom_sm8450-devicetrees-6.12 kernel/vendor/qcom/devicetrees-stock
          cp kernel/vendor/qcom/devicetrees-stock -r kernel/vendor/qcom/devicetrees 2>/dev/null || (mkdir -p kernel/vendor/qcom/devicetrees && cp -r kernel/vendor/qcom/devicetrees-stock/* kernel/vendor/qcom/devicetrees/)
          cp devicetrees/qcom/diwali* kernel/vendor/qcom/devicetrees/qcom/
          cp devicetrees/qcom/Makefile kernel/vendor/qcom/devicetrees/qcom/Makefile
          cp build.config.msm.diwali kernel/build.config.msm.diwali
          git clone --depth 1 --branch lineage-24.0 https://github.com/ltdq/android_kernel_qcom_sm8450-modules-6.12 kernel-modules || true
          ls kernel/vendor/qcom/devicetrees/qcom/diwali* | head
      - name: Build (Kleaf/GKI — pode levar 1-3h)
        run: |
          cd kernel
          BUILD_CONFIG=build.config.msm.diwali build/build.sh 2>&1 | tail -n 100
        timeout-minutes: 300
      - name: Empacota AnyKernel3 + recovery boot.img
        if: always()
        run: |
          ls kernel/out/*/dist/ 2>/dev/null | head -n 40 || ls kernel/out/ 2>/dev/null | head
          mkdir -p out
          find kernel/out -maxdepth 4 -name "Image" -o -maxdepth 4 -name "*.dtb" -o -maxdepth 4 -name "*.dtbo" -o -maxdepth 4 -name "dtbo.img" 2>/dev/null | head -n 40
          cp $(find kernel/out -name "Image" | head -n 1) out/ 2>/dev/null || true
          cp $(find kernel/out -name "*.dtb" | head -n 20) out/ 2>/dev/null || true
          cp $(find kernel/out -name "dtbo.img" | head -n 1) out/ 2>/dev/null || true
          ls -lh out/ || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: marble-kernel-out
          path: out/
