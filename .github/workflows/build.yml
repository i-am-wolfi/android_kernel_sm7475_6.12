name: build-marble-diwali

on:
  workflow_dispatch:
  push:
    branches: [lineage-24.0]

jobs:
  dtb-check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Valida Makefile + DTS diwali
        run: |
          grep -q DIWALI_BASE_DTB devicetrees/qcom/Makefile
          grep -q CONFIG_ARCH_DIWALI devicetrees/qcom/Makefile
          ls devicetrees/qcom/diwali.dts devicetrees/qcom/diwali.dtsi devicetrees/qcom/diwalip.dts
          ls devicetrees/qcom/diwali-*-overlay.dtso
          # compilação real acontece no kernel (tem dt-bindings/); aqui só sanity
          ! grep -q '\.dts"' devicetrees/qcom/Makefile || true
          echo "sanity OK — dt-bindings validados no full-kernel"
      - uses: actions/upload-artifact@v4
        with:
          name: diwali-sanity
          path: devicetrees/qcom/diwali*

  full-kernel:
    runs-on: ubuntu-22.04
    needs: dtb-check
    steps:
      - uses: actions/checkout@v4
      - name: Deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq git-core gnupg flex bison build-essential zip curl \
            zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 libncurses5-dev \
            lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev \
            libxml2-utils xsltproc unzip fontconfig python3 python3-pip cpio \
            device-tree-compiler lz4 brotli
          pip3 install --quiet git+https://github.com/google/repo.git 2>/dev/null || true
      - name: Sync kernel + modules (ltdq 6.12)
        run: |
          git clone --depth 1 --branch lineage-24.0 https://github.com/ltdq/android_kernel_qcom_sm8450-6.12 kernel
          git clone --depth 1 --branch lineage-24.0 https://github.com/ltdq/android_kernel_qcom_sm8450-devicetrees-6.12 kernel/vendor/qcom/devicetrees-stock
          cp kernel/vendor/qcom/devicetrees-stock -r kernel/vendor/qcom/devicetrees 2>/dev/null || (mkdir -p kernel/vendor/qcom/devicetrees && cp -r kernel/vendor/qcom/devicetrees-stock/* kernel/vendor/qcom/devicetrees/)
          cp devicetrees/qcom/diwali* kernel/vendor/qcom/devicetrees/qcom/
          cp devicetrees/qcom/Makefile kernel/vendor/qcom/devicetrees/qcom/Makefile
          cp build.config.msm.diwali kernel/build.config.msm.diwali
          ls kernel/vendor/qcom/devicetrees/qcom/diwali* | head
          echo "--- importa headers dt-bindings que faltam no 6.12 (do marble-s-oss/Xiaomi, recursivo) ---"
          grep -rhoE "dt-bindings/[^\">]+" devicetrees/qcom/diwali* devicetrees/qcom/diwalip* 2>/dev/null | sort -u > /tmp/need.txt
          for round in 1 2 3 4; do
            # inclui também os includes aninhados dos headers já trazidos
            grep -rhoE "dt-bindings/[^\">]+" kernel/include/dt-bindings/ 2>/dev/null | sort -u >> /tmp/need.txt
            grep -rhoE '"[a-z0-9_.-]+\.h"' kernel/include/dt-bindings/input/ kernel/include/dt-bindings/interrupt-controller/ 2>/dev/null | tr -d '"' | sort -u | while read -r q; do
              # quoted include: procura o dir do arquivo que o referencia (simplificado: tenta input/)
              [ -f "kernel/include/dt-bindings/input/$q" ] || echo "NEEDQ input/$q"
            done | sort -u > /tmp/needq.txt || true
            sort -u /tmp/need.txt -o /tmp/need.txt
            added=0
            while read -r h; do
              dst="kernel/include/$h"
              if [ ! -f "$dst" ]; then
                mkdir -p "$(dirname "$dst")"
                code=$(curl -sL -w "%{http_code}" "https://raw.githubusercontent.com/MiCode/Xiaomi_Kernel_OpenSource/marble-s-oss/include/$h" -o "$dst")
                if [ "$code" != "200" ] || [ "$(wc -c < "$dst")" -lt 50 ]; then rm -f "$dst"; echo "MISS $h (http $code)"; else echo "FETCH $h"; added=1; fi
              fi
            done < /tmp/need.txt
            # quoted neighbors (ex: linux-event-codes.h referenciado por input/input.h)
            while read -r q; do
              q="${q#NEEDQ }"
              for d in input interrupt-controller; do
                dst="kernel/include/dt-bindings/$d/$q"
                if [ ! -f "$dst" ]; then
                  mkdir -p "$(dirname "$dst")"
                  code=$(curl -sL -w "%{http_code}" "https://raw.githubusercontent.com/MiCode/Xiaomi_Kernel_OpenSource/marble-s-oss/include/dt-bindings/$d/$q" -o "$dst")
                  if [ "$code" = "200" ] && [ "$(wc -c < "$dst")" -ge 50 ]; then echo "FETCH $d/$q"; added=1; break; else rm -f "$dst"; fi
                fi
              done
            done < /tmp/needq.txt
            [ "$added" = "0" ] && break
          done
          echo "ainda faltando:"; while read -r h; do [ -f "kernel/include/$h" ] || echo "  $h"; done < /tmp/need.txt
      - name: Build DTBs diwali (recovery-ready) + tenta Kleaf
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq device-tree-compiler
          mkdir -p out
          INCS="-I kernel/include -I kernel/scripts/dtc/include-prefixes -I kernel/vendor/qcom/devicetrees/qcom"
          for d in diwali diwali-idp diwali-atp diwali-qrd diwali-hsp diwalip-idp; do
            f=kernel/vendor/qcom/devicetrees/qcom/$d.dts
            [ -f "$f" ] || { echo "SKIP $d (sem $f)"; continue; }
            # shellcheck disable=SC2086
            gcc -E -nostdinc $INCS -undef -x assembler-with-cpp "$f" -o /tmp/$d.pp.dts || { echo "FAIL cpp $d"; continue; }
            dtc -I dts -O dtb -o out/$d.dtb /tmp/$d.pp.dts && echo "OK $d" || echo "FAIL dtc $d"
          done
          # overlays .dtso -> .dtbo (plugin)
          for o in kernel/vendor/qcom/devicetrees/qcom/diwali-*-overlay.dtso; do
            b=$(basename "$o" .dtso)
            # shellcheck disable=SC2086
            gcc -E -nostdinc $INCS -undef -x assembler-with-cpp "$o" -o /tmp/$b.pp.dtso || continue
            dtc -@ -I dts -O dtb -o out/$b.dtbo /tmp/$b.pp.dtso && echo "OK $b" || echo "FAIL $b"
          done
          ls -lh out/
          echo "--- Kleaf full (esperado falhar sem manifest soc-repo; log p/ debug) ---"
          (cd kernel && python3 build_with_bazel.py --target consolidate 2>&1 | tail -n 30) || true
      - name: Empacota AnyKernel3 + recovery boot.img
        if: always()
        run: |
          ls -lh out/ || true
          echo "NOTA: Image (kernel) só sai no build Kleaf completo com manifest soc-repo; aqui vão dtb/dtbo p/ recovery"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: marble-kernel-out
          path: out/
