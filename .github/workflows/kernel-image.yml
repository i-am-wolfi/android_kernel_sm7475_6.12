name: kernel-image-marble

# Build direto (make + clang) do Image 6.12 p/ marble (diwali/SM7475)
# sobre a tree MATERIALIZADA `marble-wip` (ltdq + fill ACK + merges + fixes,
# commitada pelo snapshot-marble-kernel). Sem merge por build: fixes sao
# edicoes diretas na tree. Rebuilds apos edicao na tree = workflow_dispatch.
# Sem Bazel/soc-repo: tudo com `make`, toolchain via llvm.sh.
on:
  workflow_dispatch:
  push:
    branches: [lineage-24.0]
    paths:
      - devicetrees/**
      - scripts/**
      - .github/workflows/kernel-image.yml

env:
  ARCH: arm64
  LLVM: 1
  LLVM_IAS: 1
  CROSS_COMPILE: aarch64-linux-gnu-
  CLANG_TRIPLE: aarch64-linux-gnu-
  KBUILD_BUILD_USER: marble
  KBUILD_BUILD_HOST: action

jobs:
  image:
    runs-on: ubuntu-22.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - name: Deps + toolchain clang + ccache
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq git-core flex bison build-essential \
            zlib1g-dev libssl-dev libelf-dev dwarves device-tree-compiler \
            gcc-aarch64-linux-gnu lz4 zstd cpio python3 lsb-release wget gnupg
          sudo bash -c "$(wget -O - https://apt.llvm.org/llvm.sh)" -- 19 clang lld 2>&1 | tail -n 3
          clang-19 --version | head -n 2
          echo "/usr/lib/llvm-19/bin" >> "$GITHUB_PATH"
          export PATH="/usr/lib/llvm-19/bin:$PATH"
          # ccache do Ubuntu (4.5) quebra com clang-20 (double free): usa release oficial
          curl -sL https://github.com/ccache/ccache/releases/download/v4.14.1/ccache-4.14.1-linux-x86_64-glibc.tar.gz -o /tmp/ccache.tgz
          tar -xzf /tmp/ccache.tgz -C /tmp
          sudo install -m755 /tmp/ccache-4.14.1-linux-x86_64-glibc/ccache /usr/local/bin/ccache
          export PATH="/usr/local/bin:$PATH"
          echo "/usr/local/bin" >> "$GITHUB_PATH"
          ccache --version | head -n 1
          ccache -M 4G; ccache -z; mkdir -p ~/.ccache
      - uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-marble-${{ hashFiles('.github/workflows/kernel-image.yml') }}-v1
          restore-keys: ccache-marble-

      - name: Sync tree marble-wip + devicetrees + dt-bindings diwali
        run: |
          git clone --depth 1 --branch marble-wip https://github.com/i-am-wolfi/android_kernel_qcom_sm8450-6.12 kernel
          cd kernel && git log --oneline -3 && cd ..
          # devicetrees: identico ao fluxo antigo (stock + overlay local);
          # a vendor/ vinda do snapshot e substituida -> inputs de dts iguais
          rm -rf kernel/vendor/qcom/devicetrees
          git clone --depth 1 --branch lineage-24.0 https://github.com/ltdq/android_kernel_qcom_sm8450-devicetrees-6.12 /tmp/dts-stock 2>&1 | tail -n 1
          mkdir -p kernel/vendor/qcom/devicetrees
          cp -r /tmp/dts-stock/* kernel/vendor/qcom/devicetrees/
          cp -r devicetrees/. kernel/vendor/qcom/devicetrees/
          # gki_defconfig ja vem na tree (copiado no snapshot); sanidade
          grep -c CONFIG kernel/arch/arm64/configs/gki_defconfig
          # headers dt-bindings diwali (mesma logica do build.yml)
          fetch_one() {
            dst="kernel/include/$1"
            [ -f "$dst" ] && return 0
            mkdir -p "$(dirname "$dst")"
            code=$(curl -sL -w "%{http_code}" "https://raw.githubusercontent.com/MiCode/Xiaomi_Kernel_OpenSource/marble-s-oss/include/$1" -o "$dst")
            [ "$code" = "200" ] || { rm -f "$dst"; return 1; }
            if [ "$(wc -c < "$dst")" -lt 120 ] && ! grep -qE "#| |;|\{|" "$dst"; then
              link=$(cat "$dst"); base=$(dirname "$1")
              target=$(python3 -c "import posixpath,sys; print(posixpath.normpath(posixpath.join(sys.argv[1], sys.argv[2])))" "$base" "$link")
              rm -f "$dst"; fetch_one "$target" && cp "kernel/include/$target" "$dst"
              return 0
            fi
            [ "$(wc -c < "$dst")" -ge 50 ] || { rm -f "$dst"; return 1; }
          }
          grep -rhoE "dt-bindings/[^\">]+" kernel/vendor/qcom/devicetrees/qcom/ 2>/dev/null | sort -u > /tmp/need.txt
          for round in 1 2 3 4; do
            grep -rhoE "dt-bindings/[^\">]+" kernel/include/dt-bindings/ 2>/dev/null | sort -u >> /tmp/need.txt
            sort -u /tmp/need.txt -o /tmp/need.txt
            added=0
            while read -r h; do
              if [ ! -f "kernel/include/$h" ]; then fetch_one "$h" && added=1; fi
            done < /tmp/need.txt
            [ "$added" = "0" ] && break
          done
          mkdir -p kernel/include/dt-bindings/input kernel/include/uapi/linux
          # header de event codes: NAO sobrescrever o novo (5.10 do marble nao tem os KEY_* novos)
          if [ ! -f kernel/include/uapi/linux/input-event-codes.h ]; then
            fetch_one uapi/linux/input-event-codes.h || true
          fi
          if [ ! -f kernel/include/dt-bindings/input/linux-event-codes.h ] && [ -f kernel/include/uapi/linux/input-event-codes.h ]; then
            cp kernel/include/uapi/linux/input-event-codes.h kernel/include/dt-bindings/input/linux-event-codes.h
          fi
          echo OK sync

      - name: Wire dts vendor dir + defconfig marble
        run: |
          cd kernel
          # symlink ja vem commitado no snapshot; recria por garantia
          ln -sfn ../../../../vendor/qcom/devicetrees arch/arm64/boot/dts/vendor
          ls -la arch/arm64/boot/dts/ | grep vendor
          echo "=== auditoria de objetos (aviso) ==="
          python3 "$GITHUB_WORKSPACE/scripts/audit-objs.py" || true
          cat > /tmp/marble.fragment <<'EOF'
          CONFIG_ARCH_DIWALI=y
          CONFIG_ARCH_WAIPIO=y
          # CONFIG_RUST is not set
          CONFIG_LOCALVERSION="-marble-diwali"
          # Sem LTO nos builds de teste (link LTO e lento); ligar so no final
          # CONFIG_LTO_CLANG_THIN is not set
          # CONFIG_LTO_CLANG_FULL is not set
          # Drivers com skew 6.11/6.12 da tree, irrelevantes p/ marble (UFS, sem virtio-blk)
          # CONFIG_VIRTIO_BLK is not set
          # MHI misc (modem/WLAN): pm.c chama API que so existe com MISC ligado
          CONFIG_MHI_BUS_MISC=y
          # Confix remove deep D/sub/ qdo parent D/ cobre (evita descida dupla
          # e simbolo duplicado no vmlinux): parent precisa estar ON
          CONFIG_REGMAP=y
          CONFIG_INTERCONNECT=y
          CONFIG_INPUT=y
          CONFIG_IIO=y
          CONFIG_PINCTRL=y
          CONFIG_THERMAL=y
          CONFIG_DMA_SHARED_BUFFER=y
          CONFIG_UIO=y
          CONFIG_CPU_IDLE=y
          CONFIG_USB_GADGET=y
          CONFIG_USB_SUPPORT=y
          CONFIG_MMC=y
          CONFIG_GENERIC_PHY=y
          # arm-smmu.c chama qcom-iommu-util incondicional (fast iova,
          # pgtable ops): provedor exige o simbolo ligado
          CONFIG_QCOM_IOMMU_UTIL=y
          # Board marble (ukee/SM7475): pinctrl cape + UFS v4 cape.
          # diwali (ARCH_DIWALI) era outro silicio: off.
          # CONFIG_ARCH_DIWALI is not set
          # pinctrl cape usa sm8450-tlmm via alias (mesmo IP); sem driver separado
          CONFIG_PHY_QCOM_UFS=y
          CONFIG_PHY_QCOM_UFS_V4=y
          CONFIG_PHY_QCOM_UFS_V4_CAPE=y
          # BTF exige pahole novo (dwarves do 22.04 falha com DWARF5 no 6.12:
          # 'Invalid argument'); recovery de teste nao usa BPF CO-RE -> off
          # (volta no final se preciso)
          # CONFIG_DEBUG_INFO_BTF is not set
          # CONFIG_DEBUG_INFO_BTF_MODULES is not set
          # hyp/KVM deletado da tree (Kleaf pega do common); sem par p/ headers -> off no teste
          # CONFIG_KVM is not set
          # pKVM precisa de KVM (mod_arch_specific.hyp) -> off junto
          # CONFIG_ARM_SMMU_V3_PKVM is not set
          # IKCONFIG/KHEADERS/IKHEADERS exigem regras de geracao ausentes na tree -> off no teste
          # CONFIG_IKCONFIG is not set
          # CONFIG_IKCONFIG_PROC is not set
          # CONFIG_KHEADERS is not set
          # CONFIG_IKHEADERS is not set
          # SMMU v500 (qsmmu-v500) e driver v2; dispatcher precisa de hyp/KVM -> off
          CONFIG_ARM_SMMU=y
          # CONFIG_QCOM_SMMU_V2_V3_DISPATCHER is not set
          # Teste = so QCOM: desliga platforms alheias (menos drivers inuteis, build rapido)
          # CONFIG_ARCH_ACTIONS is not set
          # CONFIG_ARCH_AIROHA is not set
          # CONFIG_ARCH_SUNXI is not set
          # CONFIG_ARCH_ALPINE is not set
          # CONFIG_ARCH_APPLE is not set
          # CONFIG_ARCH_BCM2835 is not set
          # CONFIG_ARCH_BCM_IPROC is not set
          # CONFIG_ARCH_BCMBCA is not set
          # CONFIG_ARCH_BRCMSTB is not set
          # CONFIG_ARCH_BERLIN is not set
          # CONFIG_ARCH_BITMAIN is not set
          # CONFIG_ARCH_EXYNOS is not set
          # CONFIG_ARCH_SPARX5 is not set
          # CONFIG_ARCH_K3 is not set
          # CONFIG_ARCH_LG1K is not set
          # CONFIG_ARCH_HISI is not set
          # CONFIG_ARCH_KEEMBAY is not set
          # CONFIG_ARCH_MEDIATEK is not set
          # CONFIG_ARCH_MESON is not set
          # CONFIG_ARCH_MVEBU is not set
          # CONFIG_ARCH_LAYERSCAPE is not set
          # CONFIG_ARCH_MXC is not set
          # CONFIG_ARCH_S32 is not set
          # CONFIG_ARCH_MA35 is not set
          # CONFIG_ARCH_NPCM is not set
          # CONFIG_ARCH_PENSANDO is not set
          # CONFIG_ARCH_REALTEK is not set
          # CONFIG_ARCH_RENESAS is not set
          # CONFIG_ARCH_ROCKCHIP is not set
          # CONFIG_ARCH_SEATTLE is not set
          # CONFIG_ARCH_INTEL_SOCFPGA is not set
          # CONFIG_ARCH_STM32 is not set
          # CONFIG_ARCH_SYNQUACER is not set
          # CONFIG_ARCH_TEGRA is not set
          # CONFIG_ARCH_TESLA_FSD is not set
          # CONFIG_ARCH_SPRD is not set
          # CONFIG_ARCH_THUNDER is not set
          # CONFIG_ARCH_THUNDER2 is not set
          # CONFIG_ARCH_UNIPHIER is not set
          # HID irrelevante p/ recovery de teste
          # CONFIG_HID is not set
          # NAO usar SHMBRIDGE no marble (usando ramo #else com stubs inline)
          # CONFIG_QCOM_TZMEM_MODE_SHMBRIDGE is not set
          # zram custom da tree incompativel c/ headers (writeback/prefetch + zcomp);
          # swap nao precisa p/ boot de teste -> off (volta depois)
          # CONFIG_ZRAM is not set
          EOF
          PATH="/usr/lib/llvm-19/bin:$PATH" scripts/kconfig/merge_config.sh -m arch/arm64/configs/gki_defconfig /tmp/marble.fragment
          PATH="/usr/lib/llvm-19/bin:$PATH" make ARCH=arm64 LLVM=1 LLVM_IAS=1 olddefconfig 2>&1 | tee /tmp/olddef.log; rc=${PIPESTATUS[0]}
          if [ $rc -ne 0 ]; then
            echo "=== olddefconfig FAILED, dumping culprit Kconfig(s) ==="
            grep -aoE "[a-zA-Z0-9_./-]*Kconfig[a-zA-Z0-9_./-]*" /tmp/olddef.log | sort -u | head -n 5
            f=$(grep -aoE "[a-zA-Z0-9_./-]*Kconfig[a-zA-Z0-9_./-]*" /tmp/olddef.log | sort -u | head -n 1)
            echo "=== DUMP $f (head) ==="; sed -n '1,70p' "$f"
            echo "=== DUMP $f (tail) ==="; tail -n 80 "$f"
            sym=$(grep -aoE "Kconfig:[0-9]+" /tmp/olddef.log | head -n 1)
            echo "=== hunting dups ==="; grep -rn "config QCOM_TZMEM_MODE" drivers/firmware/ || true
            exit 1
          fi
          wc -l .config; grep -c "^CONFIG_" .config || true
          grep -E "^CONFIG_ARCH_DIWALI|^CONFIG_ARCH_WAIPIO" .config || (echo "FATAL: ARCH ausente"; exit 1)
          echo "=== AUDIT consistencia ==="
          grep -E "^(# )?CONFIG_(FAULT_INJECTION|REF_TRACKER|TRACEPOINTS|VIRTIO_BLK|KVM|IKCONFIG|KHEADERS|MHI_BUS_MISC)" .config || true
          for f in lib/fault-inject.c lib/ref_tracker.c lib/smp_processor_id.c include/linux/sched.h include/linux/ref_tracker.h; do
            printf "%s: " "$f"
            if [ -f "$f" ]; then md5sum < "$f" | cut -c1-8; printf "  ltdq-tem=%s" "$(git ls-files --error-unmatch "$f" >/dev/null 2>&1 && echo SIM || echo NAO)"; echo
            else echo AUSENTE; fi
          done
          grep -c "fail_nth" include/linux/sched.h || true
          grep -n "struct ref_tracker_dir {" -A8 include/linux/ref_tracker.h | head -n 12 || true
          echo "=== single-file verbose probe (init/main.o) ==="
          PATH="/usr/lib/llvm-19/bin:$PATH" make ARCH=arm64 LLVM=1 LLVM_IAS=1 V=1 init/main.o 2>&1 | tail -n 25 || true

      - name: DTBs fail-fast (erros de DTS antes do build longo)
        run: |
          cd kernel
          export PATH="/usr/lib/llvm-19/bin:/usr/local/bin:$PATH"
          make ARCH=arm64 LLVM=1 LLVM_IAS=1 dtbs 2>&1 | tail -n 8; rc=${PIPESTATUS[0]}
          [ $rc -eq 0 ] || exit $rc
          echo "=== marble dtbs:"; find -L arch/arm64/boot/dts -name "marble*" | head -n 8
        timeout-minutes: 15

      - name: Build Image + modules + dtbs
        run: |
          cd kernel
          export PATH="/usr/lib/llvm-19/bin:/usr/local/bin:$PATH"
          nproc; free -g | head -n 2
          df -h / /tmp | head -n 5; free -g | head -n 2
          chmod +x "$GITHUB_WORKSPACE/scripts/ar-dedupe.sh"
          make -k -j$(nproc) CC="ccache clang" AR="$GITHUB_WORKSPACE/scripts/ar-dedupe.sh" KCPPFLAGS="-I$PWD" Image.gz dtbs 2>&1 | tee /tmp/build.log | tail -n 15; rc=${PIPESTATUS[0]}
          echo "--- ccache ---"; ccache -s | head -n 12
          if [ $rc -ne 0 ]; then
            echo "=== BUILD ERRORS (por arquivo, TODOS) ==="
            grep -aE "\.(c|h|S):[0-9]+:[0-9]+: (error|fatal error)" /tmp/build.log | sed -E 's/^.* ([a-zA-Z0-9_\/.-]+\.(c|h|S)):[0-9]+:[0-9]+: ((fatal )?error).*/\1: \3/' | sort | uniq -c | sort -rn | head -n 100
            echo "=== TODOS os .o que falharam ==="
            grep -aoE "Makefile\.build:[0-9]+: [a-zA-Z0-9_\/.-]+\.o" /tmp/build.log | sed -E 's/.*: //' | sort -u | head -n 100
            echo "=== membros duplicados em vmlinux.a / built-in.a suspeitos ==="
            for a in vmlinux.a drivers/base/regmap/built-in.a drivers/usb/gadget/function/built-in.a drivers/pci/controller/built-in.a kernel/built-in.a; do
              [ -f "$a" ] && { echo "--- $a:"; llvm-ar t "$a" 2>/dev/null | sort | uniq -d | head -n 10; } || true
            done
            echo "=== SCAN todos built-in.a com dupes internos:"
            for a in $(find . -name "built-in.a" 2>/dev/null | head -n 400); do
              dups=$(llvm-ar t "$a" 2>/dev/null | sort | uniq -d | head -n 5)
              [ -n "$dups" ] && { echo "DUP-IN $a:"; echo "$dups"; }
            done
            echo "=== SCAN fim"
            echo "=== undefined symbols (agrupados, top 40) ==="
            grep -aE "ld.lld: error: undefined symbol" /tmp/build.log | sed -E 's/.*undefined symbol: //' | sort | uniq -c | sort -rn | head -n 40 || true
            exit 1
          fi
        timeout-minutes: 300

      - name: Salva build.log completo (sempre)
        if: always()
        run: |
          ls -lh /tmp/build.log 2>/dev/null || echo "sem build.log"
          cp /tmp/build.log "$GITHUB_WORKSPACE/build-full.log" 2>/dev/null || true
          cp /tmp/ar-dedupe.log "$GITHUB_WORKSPACE/ar-dedupe.log" 2>/dev/null || true

      - name: Coleta artefatos
        if: always()
        run: |
          cd kernel
          mkdir -p ../out
          cp -v arch/arm64/boot/Image* ../out/ 2>/dev/null || true
          cp -v System.map ../out/ 2>/dev/null || true
          cp -v .config ../out/marble-defconfig 2>/dev/null || true
          find -L arch/arm64/boot/dts -name "*.dtb" -path "*diwali*" -exec cp -v {} ../out/ \; 2>/dev/null | tail -n 6
          find -L arch/arm64/boot/dts -name "marble*.dtb*" -exec cp -v {} ../out/ \; 2>/dev/null | tail -n 6
          find -L arch/arm64/boot/dts -name "*.dtbo" -path "*diwali*" -exec cp -v {} ../out/ \; 2>/dev/null | tail -n 6
          find -L arch/arm64/boot/dts -name "*.dtbo" -exec cp -v {} ../out/ \; 2>/dev/null | tail -n 3
          ls -lh ../out/ | head -n 30
          echo "--- modules ---"
          mkdir -p /tmp/mods
          make INSTALL_MOD_PATH=/tmp/mods INSTALL_MOD_STRIP=1 modules_install 2>&1 | tail -n 3 || true
          (cd /tmp/mods && tar --zstd -cf "$GITHUB_WORKSPACE/out/vendor-modules.tar.zst" lib/ 2>/dev/null) || true
          ls -lh ../out/ | head -n 30

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: marble-image-6.12
          path: out/
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: marble-build-log
          path: |
            build-full.log
            ar-dedupe.log
          if-no-files-found: warn
          retention-days: 7
