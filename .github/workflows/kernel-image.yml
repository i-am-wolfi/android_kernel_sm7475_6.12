name: kernel-image-marble

# Build direto (make + clang) do Image 6.12 p/ marble (diwali/SM7475)
# sobre base ltdq sm8450-6.12 + gki_defconfig do ACK (android16-6.12).
# Sem Bazel/soc-repo: tudo com `make`, toolchain via llvm.sh.
on:
  workflow_dispatch:
  push:
    branches: [lineage-24.0]
    paths:
      - devicetrees/**
      - scripts/**
      - .github/workflows/kernel-image.yml

env:
  ARCH: arm64
  LLVM: 1
  LLVM_IAS: 1
  CROSS_COMPILE: aarch64-linux-gnu-
  CLANG_TRIPLE: aarch64-linux-gnu-
  KBUILD_BUILD_USER: marble
  KBUILD_BUILD_HOST: action

jobs:
  image:
    runs-on: ubuntu-22.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - name: Deps + toolchain clang + ccache
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq git-core flex bison build-essential \
            zlib1g-dev libssl-dev libelf-dev dwarves device-tree-compiler \
            gcc-aarch64-linux-gnu lz4 zstd cpio python3 lsb-release wget gnupg
          sudo bash -c "$(wget -O - https://apt.llvm.org/llvm.sh)" -- 19 clang lld 2>&1 | tail -n 3
          clang-19 --version | head -n 2
          echo "/usr/lib/llvm-19/bin" >> "$GITHUB_PATH"
          # ccache do Ubuntu (4.5) quebra com clang-20 (double free): usa release oficial
          curl -sL https://github.com/ccache/ccache/releases/download/v4.14.1/ccache-4.14.1-linux-x86_64-glibc.tar.gz -o /tmp/ccache.tgz
          tar -xzf /tmp/ccache.tgz -C /tmp
          sudo install -m755 /tmp/ccache-4.14.1-linux-x86_64-glibc/ccache /usr/local/bin/ccache
          export PATH="/usr/local/bin:$PATH"
          echo "/usr/local/bin" >> "$GITHUB_PATH"
          ccache --version | head -n 1
          ccache -M 4G; ccache -z; mkdir -p ~/.ccache
      - uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-marble-${{ hashFiles('.github/workflows/kernel-image.yml') }}-v1
          restore-keys: ccache-marble-

      - name: Sync kernel + devicetrees (base 6.12.r1!) + dt-bindings diwali
        run: |
          git clone --depth 1 --branch lineage-24.0 https://github.com/ltdq/android_kernel_qcom_sm8450-6.12 kernel
          # Tree = kernel.lnx.6.12.r1 (Makefile 6.11 desatualizado): fill com ACK 6.12 (headers c/ backports qcom)
          git clone --depth 1 --branch android16-6.12-2026-06 https://android.googlesource.com/kernel/common ack-src 2>&1 | tail -n 1
          (cd ack-src && git ls-files | awk '$0 !~ /^(arch\/[^\/]+\/boot\/dts\/)/ && ($0 !~ /^Documentation\// || $0 ~ /(Kconfig|Kbuild|Makefile)/)' > /tmp/common-files.txt)
          wc -l /tmp/common-files.txt
          filled=0
          while read -r f; do
            if [ ! -e "kernel/$f" ]; then
              mkdir -p "kernel/$(dirname "$f")" 2>/dev/null || true
              cp "ack-src/$f" "kernel/$f" 2>/dev/null && filled=$((filled+1)) || echo "SKIP $f"
            fi
          done < /tmp/common-files.txt
          echo "filled=$filled"
          ls kernel/scripts/basic/fixdep.c kernel/scripts/kconfig/conf.c kernel/scripts/dtc/dtc.c kernel/arch/arm64/Kconfig 2>&1
          # parsers (kconfig/dtc/genksyms) 100% ACK: ltdq mistura lexer velho + backend novo
          # = binarios corrompidos (conf com parse fantasma, genksyms com double-free)
          for d in scripts/kconfig scripts/dtc scripts/genksyms; do cp -rf ack-src/$d/. kernel/$d/; done
          # infra do Kconfig 6.12 (funcoes $(...) usadas pelos Kconfigs; a da tree e 6.11 e nao tem)
          for f in scripts/Kconfig.include scripts/rustc-version.sh scripts/rustc-llvm-version.sh scripts/rust_is_available.sh scripts/cc-version.sh scripts/as-version.sh scripts/ld-version.sh scripts/pahole-version.sh; do
            [ -f "ack-src/$f" ] && cp -f "ack-src/$f" "kernel/$f" && echo "INFRA $f"
          done
          echo "parsers synced"
          # (merge fino via merge-kconfig.py no passo Wire; aqui so fill)
          git clone --depth 1 --branch lineage-24.0 https://github.com/ltdq/android_kernel_qcom_sm8450-devicetrees-6.12 kernel/vendor/qcom/devicetrees-stock
          mkdir -p kernel/vendor/qcom/devicetrees
          cp -r kernel/vendor/qcom/devicetrees-stock/* kernel/vendor/qcom/devicetrees/
          cp -r devicetrees/. kernel/vendor/qcom/devicetrees/
          # defconfig base: gki_defconfig do ACK 6.12 + fragment marble
          cp ack-src/arch/arm64/configs/gki_defconfig kernel/arch/arm64/configs/gki_defconfig
          grep -c CONFIG kernel/arch/arm64/configs/gki_defconfig
          # headers dt-bindings diwali (mesma logica do build.yml)
          fetch_one() {
            dst="kernel/include/$1"
            [ -f "$dst" ] && return 0
            mkdir -p "$(dirname "$dst")"
            code=$(curl -sL -w "%{http_code}" "https://raw.githubusercontent.com/MiCode/Xiaomi_Kernel_OpenSource/marble-s-oss/include/$1" -o "$dst")
            [ "$code" = "200" ] || { rm -f "$dst"; return 1; }
            if [ "$(wc -c < "$dst")" -lt 120 ] && ! grep -qE "#| |;|\{|" "$dst"; then
              link=$(cat "$dst"); base=$(dirname "$1")
              target=$(python3 -c "import posixpath,sys; print(posixpath.normpath(posixpath.join(sys.argv[1], sys.argv[2])))" "$base" "$link")
              rm -f "$dst"; fetch_one "$target" && cp "kernel/include/$target" "$dst"
              return 0
            fi
            [ "$(wc -c < "$dst")" -ge 50 ] || { rm -f "$dst"; return 1; }
          }
          grep -rhoE "dt-bindings/[^\">]+" kernel/vendor/qcom/devicetrees/qcom/ 2>/dev/null | sort -u > /tmp/need.txt
          for round in 1 2 3 4; do
            grep -rhoE "dt-bindings/[^\">]+" kernel/include/dt-bindings/ 2>/dev/null | sort -u >> /tmp/need.txt
            sort -u /tmp/need.txt -o /tmp/need.txt
            added=0
            while read -r h; do
              if [ ! -f "kernel/include/$h" ]; then fetch_one "$h" && added=1; fi
            done < /tmp/need.txt
            [ "$added" = "0" ] && break
          done
          mkdir -p kernel/include/dt-bindings/input kernel/include/uapi/linux
          curl -sL "https://raw.githubusercontent.com/MiCode/Xiaomi_Kernel_OpenSource/marble-s-oss/include/uapi/linux/input-event-codes.h" -o kernel/include/uapi/linux/input-event-codes.h
          cp kernel/include/uapi/linux/input-event-codes.h kernel/include/dt-bindings/input/linux-event-codes.h
          echo OK sync

      - name: Wire dts vendor dir + defconfig marble
        run: |
          cd kernel
          # devicetrees repo == arch/arm64/boot/dts/vendor (Makefile + bindings + qcom)
          ln -sfn ../../../../vendor/qcom/devicetrees arch/arm64/boot/dts/vendor
          ls -la arch/arm64/boot/dts/ | grep vendor
          # Merge Kconfigs: umbrellas trocadas por versoes qcom-only -> base ACK 6.12
          # + blocos/sources qcom unicos (sem duplicar simbolos).
          python3 "$GITHUB_WORKSPACE/scripts/merge-kconfig.py" ../ack-src
          python3 "$GITHUB_WORKSPACE/scripts/merge-makefiles.py" ../ack-src
          cat > /tmp/marble.fragment <<'EOF'
          CONFIG_ARCH_DIWALI=y
          CONFIG_ARCH_WAIPIO=y
          # CONFIG_RUST is not set
          CONFIG_LOCALVERSION="-marble-diwali"
          # Sem LTO nos builds de teste (link LTO e lento); ligar so no final
          # CONFIG_LTO_CLANG_THIN is not set
          # CONFIG_LTO_CLANG_FULL is not set
          # Drivers com skew 6.11/6.12 da tree, irrelevantes p/ marble (UFS, sem virtio-blk)
          # CONFIG_VIRTIO_BLK is not set
          # MHI misc (modem/WLAN): pm.c chama API que so existe com MISC ligado
          CONFIG_MHI_BUS_MISC=y
          # hyp/KVM deletado da tree (Kleaf pega do common); sem par p/ headers -> off no teste
          # CONFIG_KVM is not set
          EOF
          PATH="/usr/lib/llvm-19/bin:$PATH" scripts/kconfig/merge_config.sh -m arch/arm64/configs/gki_defconfig /tmp/marble.fragment
          PATH="/usr/lib/llvm-19/bin:$PATH" make ARCH=arm64 LLVM=1 LLVM_IAS=1 olddefconfig 2>&1 | tee /tmp/olddef.log; rc=${PIPESTATUS[0]}
          if [ $rc -ne 0 ]; then
            echo "=== olddefconfig FAILED, dumping culprit Kconfig(s) ==="
            grep -aoE "[a-zA-Z0-9_./-]*Kconfig[a-zA-Z0-9_./-]*" /tmp/olddef.log | sort -u | head -n 5
            f=$(grep -aoE "[a-zA-Z0-9_./-]*Kconfig[a-zA-Z0-9_./-]*" /tmp/olddef.log | sort -u | head -n 1)
            echo "=== DUMP $f (head) ==="; sed -n '1,70p' "$f"
            echo "=== DUMP $f (tail) ==="; tail -n 80 "$f"
            sym=$(grep -aoE "Kconfig:[0-9]+" /tmp/olddef.log | head -n 1)
            echo "=== hunting dups ==="; grep -rn "config QCOM_TZMEM_MODE" drivers/firmware/ || true
            exit 1
          fi
          wc -l .config; grep -c "^CONFIG_" .config || true
          grep -E "^CONFIG_ARCH_DIWALI|^CONFIG_ARCH_WAIPIO" .config || (echo "FATAL: ARCH ausente"; exit 1)
          echo "=== single-file verbose probe (init/main.o) ==="
          PATH="/usr/lib/llvm-19/bin:$PATH" make ARCH=arm64 LLVM=1 LLVM_IAS=1 V=1 init/main.o 2>&1 | tail -n 25 || true

      - name: Build Image + modules + dtbs
        run: |
          cd kernel
          export PATH="/usr/lib/llvm-19/bin:$PATH"
          nproc; free -g | head -n 2
          df -h / /tmp | head -n 5; free -g | head -n 2
          make -k -j$(nproc) KCPPFLAGS="-I$PWD" Image.gz modules dtbs 2>&1 | tee /tmp/build.log | tail -n 15; rc=${PIPESTATUS[0]}
          echo "--- ccache ---"; ccache -s | head -n 12
          if [ $rc -ne 0 ]; then
            echo "=== BUILD ERRORS ==="; grep -aB8 -aA3 "Error [12]\|error:" /tmp/build.log | head -n 80
            exit 1
          fi
        timeout-minutes: 300

      - name: Coleta artefatos
        if: always()
        run: |
          cd kernel
          mkdir -p ../out
          cp -v arch/arm64/boot/Image* ../out/ 2>/dev/null || true
          cp -v System.map ../out/ 2>/dev/null || true
          cp -v .config ../out/marble-defconfig 2>/dev/null || true
          find arch/arm64/boot/dts -name "*.dtb" -path "*diwali*" -exec cp -v {} ../out/ \; 2>/dev/null | tail -n 3
          find arch/arm64/boot/dts -name "*.dtbo" -exec cp -v {} ../out/ \; 2>/dev/null | tail -n 3
          ls -lh ../out/ | head -n 30
          echo "--- modules ---"
          mkdir -p /tmp/mods
          make INSTALL_MOD_PATH=/tmp/mods INSTALL_MOD_STRIP=1 modules_install 2>&1 | tail -n 3 || true
          (cd /tmp/mods && tar --zstd -cf "$GITHUB_WORKSPACE/out/vendor-modules.tar.zst" lib/ 2>/dev/null) || true
          ls -lh ../out/ | head -n 30

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: marble-image-6.12
          path: out/
